ServerName localhost
ServerTokens Prod
ServerSignature Off
<VirtualHost *:${APACHE_HTTP_PORT}>
    DocumentRoot /var/www/html
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api
    <Directory /var/www/html>
        Require all granted
        Options -Indexes
        AllowOverride None
        FallbackResource /index.html
    </Directory>
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
</VirtualHost>
<IfModule mpm_event_module>
    StartServers 1
    ServerLimit 2
    ThreadsPerChild 25
    MinSpareThreads 25
    MaxSpareThreads 50
    MaxRequestWorkers 50
</IfModule>
