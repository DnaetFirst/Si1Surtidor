ServerName localhost
ProxyPreserveHost On
ProxyPass /api ${API_UPSTREAM}/api
ProxyPassReverse /api ${API_UPSTREAM}/api
<Directory "/usr/local/apache2/htdocs">
    Require all granted
    Options -Indexes
    FallbackResource /index.html
</Directory>
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "same-origin"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
